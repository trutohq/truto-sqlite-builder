name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Bun ${{ matrix.bun-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        bun-version: [latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Run linting
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Run tests with coverage
        run: bun run test:coverage

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [test, security]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Bisect 1 - real package.json metadata + stub code
        continue-on-error: true
        run: |
          mkdir -p /tmp/c1 && cd /tmp/c1
          node -e "const p=require('$GITHUB_WORKSPACE/package.json'); p.version='2.0.2-canary.1'; p.main='index.js'; delete p.files; delete p.exports; delete p.types; delete p.scripts; console.log(JSON.stringify(p))" > package.json
          echo "module.exports = {};" > index.js
          npm publish --access public --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Bisect 2 - real README + stub code
        continue-on-error: true
        run: |
          mkdir -p /tmp/c2 && cd /tmp/c2
          printf '{"name":"@truto/sqlite-builder","version":"2.0.2-canary.2","description":"debug canary","license":"MIT","main":"index.js"}' > package.json
          echo "module.exports = {};" > index.js
          cp "$GITHUB_WORKSPACE/README.md" .
          npm publish --access public --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Bisect 3 - real dist + stub metadata
        continue-on-error: true
        run: |
          mkdir -p /tmp/c3 && cd /tmp/c3
          printf '{"name":"@truto/sqlite-builder","version":"2.0.2-canary.3","description":"debug canary","license":"MIT","main":"dist/index.js"}' > package.json
          cp -r "$GITHUB_WORKSPACE/dist" .
          npm publish --access public --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Bisect results
        run: echo "check step outcomes above"
