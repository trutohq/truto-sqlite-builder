name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Bun ${{ matrix.bun-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        bun-version: [latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Run linting
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Run tests with coverage
        run: bun run test:coverage

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [test, security]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Confirm trigger line and fixed README
        run: |
          RESULTS=""
          run_canary() { # $1=label $2=version-suffix $3=readme-file
            DIR=$(mktemp -d) && cp "$3" "$DIR/README.md" && cd "$DIR"
            printf '{"name":"@truto/sqlite-builder","version":"2.0.2-canary.%s","description":"debug canary","license":"MIT","main":"index.js"}' "$2" > package.json
            echo "module.exports = {};" > index.js
            if npm publish --access public --tag canary > /tmp/out$2.log 2>&1; then
              RESULTS="$RESULTS\n$1: PUBLISHED"
            else
              RESULTS="$RESULTS\n$1: BLOCKED 403"
            fi
            cd "$GITHUB_WORKSPACE"
          }
          echo "compileFilter({ 'user; DROP TABLE': 'value' }) // Invalid identifier" > /tmp/line551.md
          run_canary "A: original line 551 alone" 30 /tmp/line551.md
          run_canary "B: full FIXED README" 31 "$GITHUB_WORKSPACE/README.md"
          sed -n '535,562p' "$GITHUB_WORKSPACE/README.md" > /tmp/chunk-fixed.md
          run_canary "C: chunk 535-562 with fix" 32 /tmp/chunk-fixed.md
          echo "=========== RESULTS ==========="
          echo -e "$RESULTS"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
