name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Bun ${{ matrix.bun-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        bun-version: [latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Run linting
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Run tests with coverage
        run: bun run test:coverage

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [test, security]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Bisect README lines 451-675 in 28-line chunks
        run: |
          RESULTS=""
          N=20
          START=451
          while [ $START -le 675 ]; do
            END=$((START+27)); [ $END -gt 675 ] && END=675
            DIR=/tmp/r$START && mkdir -p $DIR && cd $DIR
            printf '{"name":"@truto/sqlite-builder","version":"2.0.2-canary.%s","description":"debug canary","license":"MIT","main":"index.js"}' "$N" > package.json
            echo "module.exports = {};" > index.js
            sed -n "${START},${END}p" "$GITHUB_WORKSPACE/README.md" > README.md
            if npm publish --access public --tag canary > /tmp/out$START.log 2>&1; then
              RESULTS="$RESULTS\nlines $START-$END (canary.$N): PUBLISHED"
            else
              RESULTS="$RESULTS\nlines $START-$END (canary.$N): BLOCKED 403"
            fi
            N=$((N+1))
            START=$((END+1))
          done
          echo "=========== RESULTS ==========="
          echo -e "$RESULTS"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
